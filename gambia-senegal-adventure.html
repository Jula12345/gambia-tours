            <h1>🇬🇲 Gambia & Senegal Przygoda</h1>
            <p class="subtitle">Premium 14-Dniowe Doświadczenie Kulturowe i Przyrodnicze</p>
            <p><strong>Odkryj Afrykę Zachodnią z Ekspertami Lokalnymi Przewodnikami</strong></p>
        </div>

        <div class="highlight-box">
            <h3>🎯 Premium Przygoda w Afryce Zachodniej</h3>
            <p>Kompletny 14-dniowy program łączący kulturę, naturę i przygodę w Gambii i Senegalu z wielojęzycznym wsparciem i profesjonalną lokalną obsługą.</p>
        </div>

        <h2 style="color: #FFB300; font-size: 1.8rem; margin: 2rem 0 1rem 0;">📅 Program Dnia po Dniu</h2>

        <div class="day-item">
            <h3>Dzień 1 – Przylot – Banjul i Wybrzeże</h3>
            <p>Przylot do Banjul. Powitanie przez lokalny zespół i prywatny transfer klimatyzowanym samochodem 4×4 na wybrzeże (ok. 30–45 minut). Po zakwaterowaniu przewodnik przedstawi krótkie informacje o zwyczajach, walucie i bezpieczeństwie. Czas na spacer po plaży o zachodzie słońca i opcjonalną kolację powitalną (rezerwacja z wyprzedzeniem).</p>
            <div class="accommodation">🏨 Nocleg: Senegambia Beach Hotel (4★)</div>
        </div>
        
        <div class="day-item">
            <h3>Dzień 2 – Banjul i Bakau – Miasto i Kultura</h3>
            <p>Poranek w stolicy Gambii. Zwiedzanie lokalnych rynków, architektury kolonialnej, muzeum narodowego i plaży Bakau. Obserwacja rybaków przy pracy, lunch w lokalnej restauracji. Popołudnie: wizyta w centrum kultury mandinka, tradycyjna muzyka i taniec. Wieczór wolny na wybrzeżu.</p>
            <div class="accommodation">🏨 Nocleg: Senegambia Beach Hotel (4★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 3 – Rezerwat Przyrody Abuko i Wioska Rybacka Tanji</h3>
            <p>Wczesny poranek w rezerwacie Abuko – obserwacja ponad 40 gatunków ptaków, małp i innych zwierząt. Spacer szlakami wśród dziewiczej roślinności tropikalnej. Popołudnie: wizyta w tradycyjnej wiosce rybackiej Tanji, obserwacja powrotu łodzi rybackich, targ rybny, spotkanie z miejscowymi rybakami.</p>
            <div class="accommodation">🏨 Nocleg: Senegambia Beach Hotel (4★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 4 – Wyspa Kunta Kinteh (UNESCO) i Rejs po Rzece</h3>
            <p>Całodniowa wyprawa do miejsca UNESCO – wyspy Kunta Kinteh (dawniej James Island). Rejs statkiem po rzece Gambia, zwiedzanie fortu z XVII wieku, muzeum historii niewolnictwa. Lunch na pokładzie. Popołudnie: obserwacja hipopotamów, krokodyli i ptactwa wodnego podczas rejsu powrotnego.</p>
            <div class="accommodation">🏨 Nocleg: Senegambia Beach Hotel (4★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 5 – Las Makasutu – Spływ Czółnem i Wizyta w Wiosce</h3>
            <p>Transfer do lasu Makasutu (1,5h jazdy). Spływ tradycyjnymi czółnami przez kanały w namorzynach, obserwacja unikalnej fauny i flory. Wizyta w autentycznej wiosce mandinka: spotkanie ze starszyzną, tradycyjne rzemiosło, udział w codziennych czynnościach mieszkańców, obiad w rodzinie.</p>
            <div class="accommodation">🏨 Nocleg: Makasutu Culture Forest Lodge (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 6 – Wybrzeże Sanyang / Kartong – Jazda Konna nad Atlantykiem</h3>
            <p>Transfer na dziewicze wybrzeże Sanyang. Jazda konna po plaży przy oceanie Atlantyckim (dla początkujących i zaawansowanych). Lunch w lokalnej restauracji. Popołudnie: relaxing na plaży, opcjonalnie surfing, zawody beach volley z miejscowymi. Wieczór: kolacja przy ognisku na plaży.</p>
            <div class="accommodation">🏨 Nocleg: Sanyang Beach Resort (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 7 – Park Narodowy Kiang West i Dolna Gambia</h3>
            <p>Safari w Parku Narodowym Kiang West (2h jazdy). Obserwacja antylop, małp, warthogów i ponad 250 gatunków ptaków. Lunch w buszu. Popołudnie: rejs po meandrach dolnej Gambii, wizyty w małych wioskach nad rzeką, tradycyjna ceremonia powitania, lokalny taniec i śpiew.</p>
            <div class="accommodation">🏨 Nocleg: River Lodge (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 8 – Bintang Bolong – Rejs po Namorzynach</h3>
            <p>Całodniowy rejs po kanałach Bintang Bolong – największym obszarze namorzynów w Gambii. Obserwacja flamingów, pelikanów, ospreys. Wizyta na wyspie Jaring – spotkanie z rzemieślnikami wyrabiającymi tradycyjne naczynia. Lunch na wyspie. Nocny rejs: obserwacja świetlików i nocnych dźwięków buszu.</p>
            <div class="accommodation">🏨 Nocleg: River Lodge (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 9 – Janjanbureh (Georgetown) i Rzeka Gambia</h3>
            <p>Transfer do Janjanbureh (Georgetown) – 3h jazdy przez centralną Gambię. Popołudnie: zwiedzanie Georgetown – historycznego miasta kolonialnego na wyspie MacCarthy, rynek lokalny, spotkanie z miejscowymi historykami. Wieczór: tradycyjny spektakl muzyczny w wykonaniu grup etnicznych Mandinka, Fula i Wolof.</p>
            <div class="accommodation">🏨 Nocleg: Georgetown Lodge (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 10 – Kręgi Kamienne Wassu i Powrót na Wybrzeże</h3>
            <p>Rano: wyprawa do kręgów kamiennych w Wassu (UNESCO) – 1200-letnie megality. Oprowadzenie z lokalnym historykiem, poznanie legend i znaczenia kamieni. Lunch w lokalnej wiosce. Popołudnie: powrót na wybrzeże (3h jazdy), ostatni wieczór w hotelu nadmorskim.</p>
            <div class="accommodation">🏨 Nocleg: Senegambia Beach Hotel (4★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 11 – Senegal – Rezerwat Przyrody Fathala (opcjonalnie Walking with Lions)</h3>
            <p>Transfer do Senegalu przez przejście graniczne Karang (1h jazdy + formalności). Rezerwat Fathala: safari z żyrafami, antylopami, strusimi, warthogami. Opcjonalnie: spacer z oswojone lwami (150€ extra). Lunch w rezerwacie. Wieczór: transfer do hotelu w okolicy Saint-Louis lub powrót do Gambii.</p>
            <div class="accommodation">🏨 Nocleg: Hotel w Senegalu lub Gambia</div>
        </div>

        <div class="day-item">
            <h3>Dzień 12 – Senegal – Jezioro Różowe (Lac Rose)</h3>
            <p>Transfer do słynnego Lac Rose (Różowe Jezioro) koło Dakaru (2-3h jazdy). Zwiedzanie jeziora o wyjątkowym kolorze różowym (przez sole i algi). Spotkanie z lokalnymi górnikami soli, przejażdżka wielbłądami po wydmach. Lunch w lokalnej restauracji. Popołudnie: plaża w Dakare, zakupy w lokalnych sklepach z pamiątkami.</p>
            <div class="accommodation">🏨 Nocleg: Hotel w Dakare (3★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 13 – Wybrzeże – Czas Wolny i Kolacja Pożegnalna</h3>
            <p>Dzień relaksu nad oceanem. Możliwość udziału w opcjonalnych zajęciach: stand-up paddle, kajaki, wędkarstwo, masaże i spa, zakupy sztuki, batiku i rzeźb u sprawdzonych rzemieślników. Wieczorem kolacja pożegnalna przy muzyce na żywo.</p>
            <div class="accommodation">🏨 Nocleg: Hotel wybrzeże (4★)</div>
        </div>

        <div class="day-item">
            <h3>Dzień 14 – Wylot</h3>
            <p>Transfer na lotnisko w Banjul (30-45 minut). Czas na ostatnie zakupy w duty-free. Wylot zgodnie z rozkładem lotów.</p>
            <div class="accommodation">✈️ Wylot z lotniska Banjul</div>
        </div>
